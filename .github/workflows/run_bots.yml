name: Bot Cào Tin Tức (3 Con)

on:
  schedule:
    - cron: '*/5 * * * *'  # Chạy mỗi 5 phút
  workflow_dispatch:       # Nút chạy thủ công

permissions:
  contents: write          # Cấp quyền ghi file json

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    # 👇👇👇 THÊM ĐOẠN NÀY ĐỂ BƠM SECRETS VÀO 👇👇👇
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    # 👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Các bước chạy bot giữ nguyên, chúng sẽ tự đọc được biến env ở trên
    - name: Run Bot 1
      run: python mot_con_bot.py
      continue-on-error: true

    - name: Run Bot 2
      run: python hai_con_bot.py # Nhớ đổi tên file cho đúng file của bạn
      continue-on-error: true

    - name: Run Bot 3
      run: python ba_con_bot.py  # Nhớ đổi tên file cho đúng file của bạn
      continue-on-error: true

    - name: Commit and Push Data
      run: |
        git config --global user.name "Bot Cào Tin"
        git config --global user.email "bot@github.com"
        git add data_news*.json
        timestamp=$(date -u)
        git commit -m "Auto-update data: ${timestamp}" || exit 0
        git push